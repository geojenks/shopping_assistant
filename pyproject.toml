[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant"
version = "0.1.0"
description = "Plan the cheapest sensible way to buy a shopping list across UK supermarkets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["playwright>=1.45"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
shop = "shopping_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["shopping_assistant*"]

[tool.setuptools.package-data]
"shopping_assistant.web" = ["static/*"]
